<h3>How to install SDL 3 on Linux</h3>
<pre><code>
        git clone https://github.com/libsdl-org/SDL.git
        cd SDL
        mkdir build &amp;&amp; cd build
        cmake .. -DSDL3_BUILD_SHARED=ON
        make -j$(nproc)
        sudo make install

</code></pre>
